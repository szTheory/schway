# Continuous integration for Schway.
#
# This workflow is the shift-left half of the phase gates: every claim that a
# phase SUMMARY used to record as a hand-driven, one-time act ("built
# ./cmd/schway and ran the four subcommands") is now asserted here on every push
# and pull request, on both initial host priorities (Linux and macOS).
#
# Two jobs, deliberately not one:
#
#   checks      Fast feedback -- vet, build, unit/integration tests, and the
#               race detector. This is what a contributor waits on.
#   evidence-aggregate  Preserves the historical Phase 6 gate and names the
#               current high-value evidence seams that must recur on both
#               initial host priorities.
#
# The historical Phase 6 script remains a baseline gate; the focused aggregate
# complements it instead of recursively re-running its full suite.
# session_phase6_test.go#TestCIWorkflowRunsCurrentAggregateGate pins both the
# retained baseline and the current evidence identifiers as workflow text.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record_validation_corpus:
        description: Generate and upload the current validation-corpus run receipt
        required: false
        type: boolean
        default: false
      phase26_focused:
        description: Run only the hosted Phase 26 checked scalar sum regression gate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.record_validation_corpus && !inputs.phase26_focused) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The native backend shells out to clang; a runner without it turns
      # every native-engine assertion into an operational skip rather than a
      # verdict, so fail loudly here instead.
      - name: Require clang
        run: clang --version
      - name: Install libc++ for sanitizer evidence
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-dev libc++abi-dev
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: go test -race -timeout=20m ./...

  evidence-aggregate:
    name: current evidence aggregate (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.record_validation_corpus && !inputs.phase26_focused) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Require clang
        run: clang --version
      - name: Install libc++ for sanitizer evidence
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-dev libc++abi-dev
      - name: scripts/verify-phase24.sh
        run: sh scripts/verify-phase24.sh
      - name: scripts/verify-phase25.sh
        run: sh scripts/verify-phase25.sh
      - name: scripts/verify-phase23.sh
        run: sh scripts/verify-phase23.sh
      - name: scripts/verify-phase6.sh
        run: sh scripts/verify-phase6.sh
      - name: Phase 15 native admission seam
        run: go test ./internal/compiler/native -run 'TestDecodeExecutionSchema2AdmissionSeam' -count=1 -v
      - name: Phase 15 session evidence seams
        run: go test ./internal/compiler/session -run 'TestSchema2ComparisonRequiresPeerVerdict|TestPhase5CompareProgramEnginesPreservesLegacySchemas|TestPhase11InterproceduralDifferential/DiamondSharedLeaf|TestPhase15CollisionGuardIsNotInert' -count=1 -v

  phase26-focused:
    name: Phase 26 checked scalar sum (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.phase26_focused
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Require clang
        run: clang --version
      - name: Phase 26 checker, peer, path, and native app regressions
        run: |
          go test ./internal/compiler/execution ./internal/compiler/interp ./internal/compiler/cgen -run '^TestPhase26(EventOccurrenceEncoding|InterpreterRepeatedCopy|NativeRepeatedCopy)$' -count=1 -v
          go test ./internal/compiler/check ./internal/compiler/corevalidate ./internal/compiler/originvalidate -run '^(TestBackEdgeRejected|TestPhase26(FixedPoint|AnalysisExhaustion|PeerIndependence|BackEdgeAuthority|BackEdgeCauseCategories|CFGBackEdgeCategories|ScalarCopyCycleBoundary))' -count=1 -v
          go test ./internal/compiler/pathoracle -run '^TestCompositionCycleGuardFailsClosed$' -count=1 -v
          go test ./internal/compiler/executionpeer -run '^TestPhase26PeerOccurrenceOrder$' -count=1 -v
          go test ./internal/compiler/session ./internal/compiler/core ./internal/compiler/interp ./internal/compiler/cgen ./internal/compiler/native -run '^TestPhase26|^TestAllOperationKindsHandledAtEverySite$|^TestPhase19U64NativeExactWidthAndOutput$' -count=1 -v
          go test ./internal/compiler/cgen ./internal/compiler/executionpeer ./internal/compiler/session -count=1

  validation-corpus-receipt:
    name: validation corpus receipt (macos-latest)
    if: github.event_name == 'workflow_dispatch' && inputs.record_validation_corpus
    runs-on: macos-latest
    env:
      TMPDIR: /tmp
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Require clang
        run: clang --version
      - name: Install libc++ for sanitizer evidence
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-dev libc++abi-dev
      - name: Export the consumer's exact pair set
        env:
          AI_SCHWAY_EVIDENCE_PAIR_OUTPUT: ${{ runner.temp }}/validation-pairs.json
        run: go test ./internal/compiler/session -run '^TestExportValidationCorpusPairs$' -count=1
      - name: Produce the sequential run receipt
        env:
          EVIDENCE_PAIRS: ${{ runner.temp }}/validation-pairs.json
          EVIDENCE_RECORD: ${{ runner.temp }}/validation-record.jsonl
          EVIDENCE_MANIFEST: ${{ runner.temp }}/validation-manifest.json
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess, time

          pairs_path = pathlib.Path(os.environ["EVIDENCE_PAIRS"])
          record_path = pathlib.Path(os.environ["EVIDENCE_RECORD"])
          manifest_path = pathlib.Path(os.environ["EVIDENCE_MANIFEST"])
          pair_bytes = pairs_path.read_bytes()
          pairs = json.loads(pair_bytes)
          arguments = []
          for pair in pairs:
              arguments.extend((pair["package"], pair["pattern"]))
          started = time.monotonic()
          subprocess.run(
              ["bash", "scripts/evidence-run-record.sh", str(record_path), *arguments],
              check=True,
          )
          elapsed = time.monotonic() - started
          record_bytes = record_path.read_bytes()
          completion = json.loads(record_bytes.splitlines()[-1])
          if completion != {"Action": "record_batch_complete", "Pairs": len(pairs)}:
              raise SystemExit("producer completion witness does not match exported pairs")
          manifest = {
              "schema": "phase16-validation-corpus-run-record/v1",
              "revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "pair_digest_sha256": hashlib.sha256(pair_bytes).hexdigest(),
              "record_digest_sha256": hashlib.sha256(record_bytes).hexdigest(),
              "completed": True,
              "produced_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z"),
              "elapsed": f"{elapsed:.3f}s",
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          print(f"recorded_pairs={len(pairs)} elapsed={elapsed:.3f}s")
          PY
      - name: Privacy scan the receipt before upload
        env:
          EVIDENCE_PAIRS: ${{ runner.temp }}/validation-pairs.json
          EVIDENCE_RECORD: ${{ runner.temp }}/validation-record.jsonl
          EVIDENCE_MANIFEST: ${{ runner.temp }}/validation-manifest.json
        run: |
          python3 - <<'PY'
          import collections, json, os, pathlib, re

          paths = [os.environ["EVIDENCE_PAIRS"], os.environ["EVIDENCE_RECORD"], os.environ["EVIDENCE_MANIFEST"]]
          payload = b"\n".join(pathlib.Path(path).read_bytes() for path in paths)
          home_users = re.findall(rb'/(?:Users|home)/([^/\s]+)', payload)
          personal_homes = [value for value in home_users if value != b"runner"]
          emails = re.findall(rb'(?i)[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}', payload)
          phones = re.compile(rb'(?<![A-Fa-f0-9])(?:\+?1[\s.-]?)?(?:\([2-9][0-9]{2}\)|[2-9][0-9]{2})[\s.-]?[2-9][0-9]{2}[\s.-]?[0-9]{4}(?![A-Fa-f0-9])')
          runner_temp_source = re.compile(rb'/tmp/Test[A-Za-z0-9_.-]+/[0-9]{3}/[A-Za-z0-9_.-]+')
          iso_timestamp = re.compile(rb'[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?(?:Z|[+-][0-9]{2}:[0-9]{2})')
          phone_counts = collections.Counter()

          def string_fields(value, key=""):
              if isinstance(value, str):
                  yield key, value.encode()
              elif isinstance(value, list):
                  for item in value:
                      yield from string_fields(item, key)
              elif isinstance(value, dict):
                  for name, item in value.items():
                      yield from string_fields(item, name)

          def scan_phone_value(key, value):
              timestamp_field = key.lower() in ("time", "produced_at") and iso_timestamp.fullmatch(value)
              temp_paths = list(runner_temp_source.finditer(value))
              for match in phones.finditer(value):
                  if timestamp_field:
                      phone_counts["classified_timestamp_field"] += 1
                  elif any(match.start() >= path.start() and match.end() <= path.end() for path in temp_paths):
                      phone_counts["classified_runner_test_temp_path"] += 1
                  else:
                      phone_counts["unclassified"] += 1

          for path, data in zip(paths, (pathlib.Path(value).read_bytes() for value in paths)):
              if path == os.environ["EVIDENCE_RECORD"]:
                  values = data.splitlines()
              else:
                  values = [data]
              for raw in values:
                  try:
                      decoded = json.loads(raw)
                  except (json.JSONDecodeError, UnicodeDecodeError):
                      scan_phone_value("unparsed", raw)
                      continue
                  for key, value in string_fields(decoded):
                      scan_phone_value(key, value)
          sensitive = {
              "ssn": len(re.findall(rb'(?<![0-9])[0-9]{3}-[0-9]{2}-[0-9]{4}(?![0-9])', payload)),
              "private_key": len(re.findall(rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----', payload)),
              "aws_key": len(re.findall(rb'\b(?:AKIA|ASIA)[0-9A-Z]{16}\b', payload)),
              "github_token": len(re.findall(rb'\b(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,})\b', payload)),
          }
          rejected = bool(personal_homes or emails or phone_counts["unclassified"] or any(sensitive.values()))
          print(f"receipt_privacy_scan={'failed' if rejected else 'pass'} home_candidates={len(personal_homes)} email_candidates={len(emails)} phone_candidates={sum(phone_counts.values())} phone_temp_path={phone_counts['classified_runner_test_temp_path']} phone_unclassified={phone_counts['unclassified']} sensitive_candidates={sum(sensitive.values())}")
          if rejected:
              raise SystemExit("receipt privacy scan rejected upload; candidate values are withheld")
          PY
      - name: Upload the temporary run receipt for review
        uses: actions/upload-artifact@v4
        with:
          name: validation-corpus-${{ github.sha }}
          path: |
            ${{ runner.temp }}/validation-pairs.json
            ${{ runner.temp }}/validation-record.jsonl
            ${{ runner.temp }}/validation-manifest.json
          if-no-files-found: error
          retention-days: 1
